name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  Execute-continuous-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@master

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with development dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e .
          pip3 install -e dev

      - name: Install coveralls
        run: pip3 install --upgrade coveralls
        if: github.event.repository.fork == false

      # NOTE (mristin):
      # We run this command to detect nasty errors such as import cycles early.
      - name: Run --help to check that the command works
        run: aas-core-codegen --help

      # NOTE (mristin):
      # We introduce this check as a fast-fail.
      - name: Check help in readme
        run: |
          python3 dev/continuous_integration/precommit.py \
            --select check-help-in-readme

      # NOTE (mristin):
      # We introduce this check as a fast-fail.
      - name: Check that __init__.py and pyproject.toml are consistent
        run: |
          python3 dev/continuous_integration/precommit.py \
            --select check-init-and-pyproject-consistent

      - name: Run the other checks except testing
        run: |
          python3 dev/continuous_integration/precommit.py \
            --skip \
              check-help-in-readme \
              check-init-and-pyproject-consistent \
              test

      # NOTE (mristin):
      # We run tests separately since they take most of the time, and we want to
      # specify different environment variables to other precommit checks.
      - name: Run tests
        run: |
          python3 dev/continuous_integration/precommit.py --select test
        env:
          # NOTE (mristin):
          # Caching the main models make the tests run faster since the same meta-model
          # is not reparsed again and again across the tests
          AAS_CORE_CODEGEN_TESTS_CACHE_MAIN_MODELS: 1

      - name: Upload Coverage
        run: coveralls --service=github
        if: github.event.repository.fork == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}
          COVERALLS_PARALLEL: true

  Finish-Coveralls:
    name: Finish Coveralls
    needs: Execute-continuous-integration
    runs-on: ubuntu-latest
    container: python:3-slim
    if: github.event.repository.fork == false
    steps:
      - name: Finish Coveralls
        run: |
          pip3 install --upgrade coveralls
          coveralls --finish --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
